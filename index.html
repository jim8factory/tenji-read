<!DOCTYPE html>
<html>
<body>

<button id="inCam">内側カメラ</button>
<button id="outCam">外側カメラ</button>
<button id="readBtn" style="margin-left:10px;">読み込む</button>
<button id="toggleInfo" style="margin-left:10px;">説明を閉じる</button>

<div style="position:relative; display:inline-block;">
  <video id="cam" autoplay playsinline style="width:300px;"></video>

  <!-- 6点ガイド -->
  <div id="guide" style="position:absolute; left:0; top:0; pointer-events:none;">
    <div style="position:absolute; left:70px; top:50px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
    <div style="position:absolute; left:70px; top:140px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
    <div style="position:absolute; left:70px; top:230px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>

    <div style="position:absolute; left:210px; top:50px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
    <div style="position:absolute; left:210px; top:140px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
    <div style="position:absolute; left:210px; top:230px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
  </div>
</div>

<canvas id="cv" width="300" height="300"></canvas>
<div id="out" style="font-size:24px; margin-top:10px;"></div>

<!-- 説明 -->
<div id="infoBox"
     style="
       position:fixed;
       top:10px;
       right:10px;
       background:#0008;
       color:white;
       padding:10px 14px;
       border-radius:8px;
       font-size:14px;
       line-height:1.4;
       z-index:9999;
     ">
  ● 赤丸の内側に点字の6点を合わせてください<br>
  ● 読み込むボタンで bits が表示されます<br>
  ● 認識した文字は音声で読み上げます
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>

// 説明開閉
toggleInfo.onclick = ()=>{
  const box = document.getElementById("infoBox");
  box.style.display = (box.style.display === "none") ? "block" : "none";
  toggleInfo.textContent = (box.style.display === "none") ? "説明を開く" : "説明を閉じる";
};

// カメラ切替
let currentStream = null;

async function startCamera(deviceId){
  if(currentStream){
    currentStream.getTracks().forEach(t=>t.stop());
  }
  let stream = await navigator.mediaDevices.getUserMedia({
    video: deviceId ? { deviceId } : true
  });
  currentStream = stream;
  cam.srcObject = stream;
}

async function getInnerCam(){
  let dev = await navigator.mediaDevices.enumerateDevices();
  let cams = dev.filter(d=>d.kind==="videoinput");
  return cams.find(d=>/front|内蔵|integrated/i.test(d.label)) || cams[0];
}

async function getOuterCam(){
  let dev = await navigator.mediaDevices.enumerateDevices();
  let cams = dev.filter(d=>d.kind==="videoinput");
  return cams.find(d=>/usb|webcam|camera/i.test(d.label)) || cams[cams.length-1];
}

inCam.onclick = async ()=>{
  let camDev = await getInnerCam();
  startCamera(camDev.deviceId);
};

outCam.onclick = async ()=>{
  let camDev = await getOuterCam();
  startCamera(camDev.deviceId);
};

// ガイド位置取得
function getGuideCircles(){
  return [...document.querySelectorAll("#guide div")].map(d=>{
    const rect = d.getBoundingClientRect();
    const base = cam.getBoundingClientRect();
    const cx = rect.left - base.left + rect.width/2;
    const cy = rect.top  - base.top  + rect.height/2;
    const r  = rect.width/2;
    return {cx, cy, r};
  });
}

// 点字デコード
function decodeBraille(bits){
  const map = {
    "100000":["a","あ"], "110000":["b","い"], "100100":["c","う"],
    "100110":["d","え"], "100010":["e","お"], "101000":["k","か"],
    "101100":["m","く"], "101110":["n","け"], "101010":["o","こ"],
    "110100":["f","さ"], "110110":["g","し"], "110010":["h","す"],
    "010100":["i","せ"], "010110":["j","そ"], "101001":["u","た"],
    "111001":["v","ち"], "101101":["x","つ"], "101111":["y","て"],
    "101011":["z","と"], "011100":["s","な"], "011110":["t","に"],
    "111100":["p","は"], "111110":["q","ひ"], "111010":["r","ふ"],
    "001000":["、"], "001100":["。"], "001010":["・","ろ"],
    "001110":["？"], "001011":["！","る"], "001001":["「","ら"],
    "001101":["」","り"], "001111":["れ"], "011010":["ぬ"],
    "011011":["ね"], "011001":["の"], "011000":["へ"], "011111":["ほ"],
    "100001":["ま"], "110001":["み"], "100101":["む"], "100111":["め"],
    "100011":["も"], "010001":["や"], "010101":["ゆ"], "010111":["よ"],
    "000001":["わ"], "000101":["を"], "000011":["ん"]
  };
  return map[bits] ? map[bits].join(" / ") : "";
}

// 読み上げ
let lastText = "";
function speakOnce(t){
  if(!t) return;
  if(t === lastText) return;
  lastText = t;

  speechSynthesis.cancel();
  const uttr = new SpeechSynthesisUtterance(t);
  uttr.lang = "ja-JP";
  speechSynthesis.speak(uttr);
}

// 点字認識
function process(){
  const ctx = cv.getContext("2d");
  ctx.drawImage(cam,0,0,300,300);

  let src = cv.imread(cv);
  cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY);
  cv.adaptiveThreshold(src, src, 255,
    cv.ADAPTIVE_THRESH_GAUSSIAN_C,
    cv.THRESH_BINARY_INV,
    7, 3
  );

  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();
  cv.findContours(src, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  let pts = [];
  for(let i=0;i<contours.size();i++){
    let cnt = contours.get(i);
    let r = cv.boundingRect(cnt);
    let area = cv.contourArea(cnt);
    let rectArea = r.width * r.height;
    let ratio = area / rectArea;

    if(r.width>8 && r.width<28 && r.height>8 && r.height<28 && ratio>0.55){
      pts.push([r.x+r.width/2, r.y+r.height/2]);
    }
  }

  let circles = getGuideCircles();
  let bits = ["0","0","0","0","0","0"];

  pts.forEach(p=>{
    circles.forEach((c, idx)=>{
      let dx = p[0] - c.cx;
      let dy = p[1] - c.cy;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < c.r * 0.9){
        bits[idx] = "1";
      }
    });
  });

  out.textContent = bits.join("");

  src.delete(); contours.delete(); hierarchy.delete();
}

// 読み込む（読み上げ保証）
readBtn.onclick = ()=>{
  process();
  const bits = out.textContent.trim();
  const text = decodeBraille(bits);
  speakOnce(text);
};

</script>
</body>
</html>
