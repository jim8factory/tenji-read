<!DOCTYPE html>
<html>
<body>

<!-- モード選択 -->
<label><input type="radio" name="mode" value="jp" checked> 日本語</label>
<label><input type="radio" name="mode" value="en"> 英字</label>
<label><input type="radio" name="mode" value="num"> 数字</label>

<br><br>

<button id="inCam">内側カメラ</button>
<button id="outCam">外側カメラ</button>
<button id="readBtn" style="margin-left:10px;">読み込む</button>

<div style="position:relative; display:inline-block; margin-top:10px;">
  <video id="cam" autoplay playsinline style="width:300px;"></video>

  <!-- 6点ガイド -->
  <div id="guide" style="position:absolute; left:0; top:0; pointer-events:none;">
    <div style="position:absolute; left:70px; top:50px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
    <div style="position:absolute; left:70px; top:140px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
    <div style="position:absolute; left:70px; top:230px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>

    <div style="position:absolute; left:210px; top:50px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
    <div style="position:absolute; left:210px; top:140px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
    <div style="position:absolute; left:210px; top:230px; width:20px; height:20px; border:2px solid red; border-radius:50%;"></div>
  </div>
</div>

<canvas id="cv" width="300" height="300"></canvas>

<!-- 説明（常時表示） -->
<div id="info"
     style="
       margin-top:15px;
       padding:10px;
       background:#333;
       color:#fff;
       border-radius:8px;
       width:300px;
       font-size:16px;
       white-space:pre-line;
     ">
【説明】
・点字は6点の組み合わせで構成されます。
・読み込み後に「bits／モード／解釈／読み上げ可否」を必ず表示します。
・未定義はそのモードでは読めない点字です。
・点不足は点が検出できなかった状態です。
・黒いポップアップは補助であり、結果は必ず下に表示されます。
</div>

<!-- 認識結果 -->
<div id="out"
     style="
       font-size:20px;
       margin-top:10px;
       background:#222;
       color:#0f0;
       padding:10px;
       border-radius:8px;
       width:300px;
       white-space:pre-line;
     ">
</div>

<!-- ポップアップ -->
<div id="popup"
     style="
       position:fixed;
       top:50%;
       left:50%;
       transform:translate(-50%, -50%);
       background:#000;
       color:#fff;
       padding:20px 30px;
       border-radius:10px;
       font-size:32px;
       display:none;
       z-index:99999;
     ">
</div>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
const cam       = document.getElementById("cam");
const cvCanvas  = document.getElementById("cv");
const out       = document.getElementById("out");
const readBtn   = document.getElementById("readBtn");

// ポップアップ
function popup(msg){
  const p = document.getElementById("popup");
  p.textContent = msg;
  p.style.display = "block";
  setTimeout(()=>{ p.style.display = "none"; }, 1200);
}

// カメラ
let currentStream = null;

async function startCamera(deviceId){
  if(currentStream){
    currentStream.getTracks().forEach(t=>t.stop());
  }
  let stream = await navigator.mediaDevices.getUserMedia({
    video: deviceId ? { deviceId } : true
  });
  currentStream = stream;
  cam.srcObject = stream;
}

document.getElementById("inCam").onclick = async ()=>{
  let dev = await navigator.mediaDevices.enumerateDevices();
  let cams = dev.filter(d=>d.kind==="videoinput");
  let camDev = cams.find(d=>/front|内蔵|integrated/i.test(d.label)) || cams[0];
  startCamera(camDev.deviceId);
};

document.getElementById("outCam").onclick = async ()=>{
  let dev = await navigator.mediaDevices.enumerateDevices();
  let cams = dev.filter(d=>d.kind==="videoinput");
  let camDev = cams.find(d=>/usb|webcam|camera/i.test(d.label)) || cams[cams.length-1];
  startCamera(camDev.deviceId);
};

// ガイド位置
function getGuideCircles(){
  const guideDivs = document.querySelectorAll("#guide div");
  return [...guideDivs].map(d=>{
    const r = d.offsetWidth / 2;
    const cx = d.offsetLeft + r;
    const cy = d.offsetTop  + r;
    return {cx, cy, r};
  });
}

// モード取得
function getMode(){
  return document.querySelector("input[name='mode']:checked").value;
}

// デコード
function decodeBraille(bits, mode){
  const jp = {
    "100000":"あ","110000":"い","100100":"う","100110":"え","100010":"お",
    "101000":"か","101100":"く","101110":"け","101010":"こ",
    "110100":"さ","110110":"し","110010":"す",
    "010100":"せ","010110":"そ",
    "101001":"た","111001":"ち","101101":"つ","101111":"て","101011":"と",
    "011100":"な","011110":"に","111100":"は","111110":"ひ","111010":"ふ",
    "001000":"、","001100":"。","001010":"ろ",
    "001110":"？","001011":"る","001001":"ら","001101":"り","001111":"れ",
    "011010":"ぬ","011011":"ね","011001":"の","011000":"へ","011111":"ほ",
    "100001":"ま","110001":"み","100101":"む","100111":"め","100011":"も",
    "010001":"や","010101":"ゆ","010111":"よ",
    "000001":"わ","000101":"を","000011":"ん"
  };

  const en = {
    "100000":"a","110000":"b","100100":"c","100110":"d","100010":"e",
    "110100":"f","110110":"g","110010":"h","010100":"i","010110":"j",
    "101000":"k","111000":"l","101100":"m","101110":"n","101010":"o",
    "111100":"p","111110":"q","111010":"r","011100":"s","011110":"t",
    "101001":"u","111001":"v","010111":"w","101101":"x","101111":"y","101011":"z"
  };

  const num = {
    "100000":"1","110000":"2","100100":"3","100110":"4","100010":"5",
    "110100":"6","110110":"7","110010":"8","010100":"9","010110":"0"
  };

  if(mode === "jp") return jp[bits] || "";
  if(mode === "en") return en[bits] || "";
  if(mode === "num") return num[bits] || "";
  return "";
}

// 読み上げ
function speakOnce(t){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "ja-JP";
  speechSynthesis.speak(u);
}

// 認識処理
function process(){
  // OpenCV準備チェック
  if(!window.cv || typeof cv.imread !== "function"){
    out.textContent =
      "bits: ------\n" +
      "モード: " + (getMode()==="jp"?"日本語":getMode()==="en"?"英字":"数字") + "\n" +
      "解釈: OpenCVがまだ読み込まれていません\n" +
      "読み上げ: 不可（ライブラリ未準備）";
    popup("準備中");
    return;
  }

  let src = null, contours = null, hierarchy = null;

  try{
    const ctx = cvCanvas.getContext("2d");
    ctx.drawImage(cam,0,0,300,300);

    src = cv.imread(cvCanvas);
    cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY);
    cv.adaptiveThreshold(src, src, 255,
      cv.ADAPTIVE_THRESH_GAUSSIAN_C,
      cv.THRESH_BINARY_INV,
      7, 3
    );

    contours = new cv.MatVector();
    hierarchy = new cv.Mat();
    cv.findContours(src, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

    let pts = [];
    for(let i=0;i<contours.size();i++){
      let cnt = contours.get(i);

      let area = cv.contourArea(cnt);
      if(area < 20 || area > 800) continue;

      let perimeter = cv.arcLength(cnt, true);
      if(perimeter === 0) continue;

      let circularity = 4 * Math.PI * area / (perimeter * perimeter);

      if(circularity > 0.55){
        let r = cv.boundingRect(cnt);
        pts.push([r.x + r.width/2, r.y + r.height/2]);
      }
    }

    let circles = getGuideCircles();
    let bits = ["0","0","0","0","0","0"];

    pts.forEach(p=>{
      circles.forEach((c, idx)=>{
        const dx = p[0] - c.cx;
        const dy = p[1] - c.cy;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist <= c.r + 10){
          bits[idx] = "1";
        }
      });
    });

    const bitStr = bits.join("");
    const mode   = getMode();
    const text   = decodeBraille(bitStr, mode);

    // 4情報を必ず返す
    let result = "";
    result += "bits: " + bitStr + "\n";
    result += "モード: " + (mode==="jp"?"日本語":mode==="en"?"英字":"数字") + "\n";

    if(bitStr === "000000"){
      result += "解釈: 認識できません（点が見えていません）\n";
      result += "読み上げ: 不可（点不足）";
      out.textContent = result;
      popup("認識できません");
      return;
    }

    if(text === ""){
      result += "解釈: 未定義（このモードでは読めません）\n";
      result += "読み上げ: 不可（未定義）";
      out.textContent = result;
      popup("未定義");
      return;
    }

    result += "解釈: " + text + "\n";
    result += "読み上げ: 可能";
    out.textContent = result;

    popup(text);
    speakOnce(text);
  }catch(e){
    out.textContent =
      "bits: ------\n" +
      "モード: " + (getMode()==="jp"?"日本語":getMode()==="en"?"英字":"数字") + "\n" +
      "解釈: 処理中にエラーが発生しました\n" +
      "読み上げ: 不可（エラー）\n\n" +
      "詳細: " + e;
    popup("エラー");
  }finally{
    if(src) src.delete();
    if(contours) contours.delete();
    if(hierarchy) hierarchy.delete();
  }
}

// 読み込みボタン
readBtn.onclick = process;
</script>
</body>
</html>
