<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>点字読み取り（スマホ外レンズ）</title>
<style>
body { font-size:24px; white-space:pre; }
video { width:100%; }
#out { margin-top:10px; }
</style>
</head>
<body>

<video id="cam" autoplay playsinline></video>
<div id="out"></div>

<script>
// ★ 背面カメラ（外レンズ）を確実に使う
navigator.mediaDevices.getUserMedia({
  video: { facingMode: { exact:"environment" } }
}).then(s => cam.srcObject=s)
.catch(()=>{
  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"environment" }
  }).then(s => cam.srcObject=s);
});

// ●○表示（複数セル）
function drawBitsArray(arr){
  let t="";
  for(const bits of arr){
    const c=i=>bits[i]==="1"?"●":"○";
    t+=c(0)+" "+c(3)+"\n"+
       c(1)+" "+c(4)+"\n"+
       c(2)+" "+c(5)+"\n\n";
  }
  out.textContent=t;
}

// 仮辞書（例）
const dict={
  "011000":"き","100001":"ゃ","001011":"ー",
  "011000 100001":"きゃ",
  "011000 100001 001011":"きゃー"
};

// 前置点
function resolve(a){
  let o=[];
  for(let i=0;i<a.length;i++){
    const b=a[i];
    if(b==="000001"||b==="000010"||b==="001111"||b==="000011"){
      const n=a[i+1]; if(!n){o.push("□");continue;}
      o.push(b+" "+n); i++; continue;
    }
    o.push(b);
  }
  return o;
}

// 後続点
function resolveYoon(a){
  let o=[];
  for(let i=0;i<a.length;i++){
    const b=a[i],n=a[i+1];
    if(n==="100001"||n==="101001"||n==="100101"){
      o.push(b+" "+n); i++; continue;
    }
    o.push(b);
  }
  return o;
}

// 促音
function resolveSokuon(a){
  let o=[];
  for(let i=0;i<a.length;i++){
    const b=a[i];
    if(b==="011001"){
      const n=a[i+1]; if(!n){o.push("□");continue;}
      o.push(b+" "+n); i++; continue;
    }
    o.push(b);
  }
  return o;
}

// 長音
function resolveChoon(a){
  let o=[];
  for(let i=0;i<a.length;i++){
    const b=a[i];
    if(b==="001011"){
      const p=o.pop(); if(!p){o.push("□");continue;}
      o.push(p+" "+b); continue;
    }
    o.push(b);
  }
  return o;
}

// 統合
function resolveAll(a){
  return resolveChoon(resolveSokuon(resolveYoon(resolve(a))));
}

let prev="";

// 読み取り
function speak(arr){
  const seq=resolveAll(arr);
  const key=seq.join("");
  if(key===prev) return;
  prev=key;

  const text=dict[key]||"□";
  console.log("読み上げ:",text);
}

// ★ 今は仮入力（あなたの detectCenters を後で入れる）
function fakeBits(){
  return ["011000","100001","001011"]; // きゃー
}

// ★ 心臓（進むループ）
function loop(){
  const bitsArray = fakeBits();   // ← 後で実カメラ処理に置換
  drawBitsArray(bitsArray);
  speak(bitsArray);
}

setInterval(loop, 500);  // ← これが「進む」本体

</script>
</body>
</html>
