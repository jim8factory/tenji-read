<!DOCTYPE html>
<html>
<body>

<!-- 文章入力 -->
<textarea id="textIn" rows="3" cols="40" placeholder="A〜Zで入力"></textarea><br>
<button onclick="renderBraille()">点字に変換</button>
<button onclick="saveDoc()">保存</button>
<button onclick="loadDoc()">読み込み</button>

<!-- 点字ビットマップ表示（読み取り対象） -->
<canvas id="brailleCanvas" width="800" height="150"
        style="border:1px solid #000;margin-top:10px;"></canvas>

<hr>

<!-- カメラ映像（読み取り） -->
<video id="cam" autoplay playsinline style="width:300px;"></video>
<canvas id="cv" width="300" height="300" style="display:none;"></canvas>
<div id="out" style="font-size:24px;margin-top:10px;"></div>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
// OpenCV 初期化待ち
cv['onRuntimeInitialized'] = () => startApp();

function startApp(){
  navigator.mediaDevices.getUserMedia({ video:true }).then(stream=>{
    cam.srcObject = stream;
  });

  // A〜Z の 6点パターン
  const brailleBits = {
    "a":[1,0,0,0,0,0],"b":[1,1,0,0,0,0],"c":[1,0,1,0,0,0],"d":[1,0,1,1,0,0],
    "e":[1,0,0,1,0,0],"f":[1,1,1,0,0,0],"g":[1,1,1,1,0,0],"h":[1,1,0,1,0,0],
    "i":[0,1,1,0,0,0],"j":[0,1,1,1,0,0],"k":[1,0,0,0,1,0],"l":[1,1,0,0,1,0],
    "m":[1,0,1,0,1,0],"n":[1,0,1,1,1,0],"o":[1,0,0,1,1,0],"p":[1,1,1,0,1,0],
    "q":[1,1,1,1,1,0],"r":[1,1,0,1,1,0],"s":[0,1,1,0,1,0],"t":[0,1,1,1,1,0],
    "u":[1,0,0,0,1,1],"v":[1,1,0,0,1,1],"w":[0,1,1,1,0,1],"x":[1,0,1,0,1,1],
    "y":[1,0,1,1,1,1],"z":[1,0,0,1,1,1]
  };

  // 点字ビットマップ描画（ワープロ）
  window.renderBraille = function(){
    const txt = textIn.value.toLowerCase();
    const c = brailleCanvas.getContext("2d");
    c.clearRect(0,0,800,150);

    let index = 0;
    for(const ch of txt){
      const bits = brailleBits[ch];
      if(!bits){ index++; continue; }

      const baseX = 40 + index*40;
      for(let i=0;i<6;i++){
        const col = (i<3)?0:1;
        const row = i%3;
        const x = baseX + col*18;
        const y = 30 + row*30;
        if(bits[i]===1){
          c.beginPath();
          c.arc(x,y,8,0,Math.PI*2);
          c.fill();
        }
      }
      index++;
    }
  };

  // 保存／読み込み
  window.saveDoc = function(){
    localStorage.setItem("brailleText", textIn.value);
    alert("保存しました");
  };

  window.loadDoc = function(){
    const t = localStorage.getItem("brailleText");
    if(!t){ alert("保存データなし"); return; }
    textIn.value = t;
    renderBraille();
  };

  // 読み取り（カメラ → 点字 → 文字）
  function decodeBraille(bits){
    const map = {
      "100000":"a","110000":"b","100100":"c","100110":"d","100010":"e",
      "110100":"f","110110":"g","110010":"h","010100":"i","010110":"j",
      "100001":"k","110001":"l","100101":"m","100111":"n","100011":"o",
      "110101":"p","110111":"q","110011":"r","010101":"s","010111":"t",
      "100001":"u","110001":"v","010111":"w","100101":"x","100111":"y","100011":"z"
    };
    return map[bits] || "";
  }

  function process(){
    const ctx = cv.getContext("2d");
    ctx.drawImage(cam,0,0,300,300);

    let src = cv.imread(cv);
    cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY);
    cv.threshold(src, src, 120, 255, cv.THRESH_BINARY_INV);

    let contours = new cv.MatVector();
    let hierarchy = new cv.Mat();
    cv.findContours(src, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

    let pts = [];
    for(let i=0;i<contours.size();i++){
      let r = cv.boundingRect(contours.get(i));
      if(r.width<40 && r.height<40) pts.push([r.x,r.y]);
    }

    let bits = ["0","0","0","0","0","0"];
    pts.forEach(p=>{
      let x=p[0], y=p[1];
      let col = x<150 ? 0 : 1;
      let row = y<100 ? 0 : (y<200 ? 1 : 2);
      let idx = row + col*3;
      bits[idx] = "1";
    });

    out.textContent = decodeBraille(bits.join(""));

    src.delete(); contours.delete(); hierarchy.delete();
    requestAnimationFrame(process);
  }

  process();
}
</script>
</body>
</html>
